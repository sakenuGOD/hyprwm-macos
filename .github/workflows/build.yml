name: Build Swift app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Swift daemon
        run: ./scripts/build-hyprwm
      - name: Test Swift daemon
        run: ./scripts/test-hyprwm
      - name: Check installer safety
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check hotkey registration
        run: |
          hotkey_checks=$(mktemp -d)
          for source in hook/tests/native_hotkey_consumer_test.m hook/tests/native_hotkey_generation_test.m; do
            executable="$hotkey_checks/$(basename "$source" .m)"
            clang -fobjc-arc -framework Carbon -framework AppKit "$source" -o "$executable"
            "$executable"
          done
